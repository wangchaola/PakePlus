<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PHP 类生成器</title>
  <style>
    body {
      font-family: "Fira Code", Consolas, monospace;
      background: linear-gradient(135deg, #1e1e2f, #2a2a3d);
      color: #f5f5f5;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #61dafb;
    }
    textarea, input {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
      font-size: 14px;
      font-family: "Fira Code", monospace;
      background: #2d2d3c;
      color: #f5f5f5;
      outline: none;
    }
    textarea {
      height: 200px;
      resize: vertical;
    }
    button {
      background: #61dafb;
      border: none;
      padding: 10px 20px;
      margin: 10px 5px 20px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #21a1f1;
      transform: scale(1.05);
    }
    pre {
      background: #1e1e2f;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      position: relative;
    }
    .btn-group {
      text-align: right;
    }
  </style>
</head>
<body>
  <h2>🚀 PHP 类生成器</h2>
  <p>输入类属性（如 <code>public int $uid;</code>）：</p>
  <textarea id="properties"></textarea>
  <label>类名: <input type="text" id="className" value="Demo"></label>
  <div class="btn-group">
    <button onclick="generate()">生成 PHP 类</button>
    <button onclick="copyCode()">复制代码</button>
  </div>

  <h3>生成结果：</h3>
  <pre id="output"></pre>

<script>
function ucfirst(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function generate() {
  let props = document.getElementById("properties").value.trim().split("\n");
  let className = document.getElementById("className").value.trim() || "Demo";

  let output = `<?php

declare(strict_types=1);
/**
 * This file is part of Hyperf.
 *
 * @link     http://gitlab/bux/bux-server
 * @document http://docs/web/#/6
 * @contact  group@hyperf.io
 * @license  https://github.com/hyperf/hyperf/blob/master/LICENSE
 */
namespace App\\Entity;

class ${className}
{
`;

  props.forEach(line => {
    line = line.trim();
    if (!line) return;
    output += "    " + line + "\n";
  });

  output += "\n";

  props.forEach(line => {
    line = line.trim();
    if (!line.startsWith("public")) return;

    let match = line.match(/public\s+(\S+)?\s*\$(\w+);/);
    if (!match) return;

    let type = match[1] && match[1] !== '' ? match[1] : '';
    let name = match[2];
    let methodName = ucfirst(name);

    output += `    public function set${methodName}(${type ? type + " " : ""}$${name}): void\n    {\n        $this->${name} = $${name};\n    }\n\n`;

    output += `    public function get${methodName}(): ${type || "mixed"}\n    {\n        return $this->${name};\n    }\n\n`;
  });

  output += "}\n";
  document.getElementById("output").textContent = output;
}

function copyCode() {
  let code = document.getElementById("output").textContent;
  if (!code.trim()) {
    alert("请先生成 PHP 类代码！");
    return;
  }
  navigator.clipboard.writeText(code).then(() => {
    alert("✅ 代码已复制到剪贴板！");
  });
}
</script>
</body>
</html>
