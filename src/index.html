<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PHP 类生成器</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        textarea { width: 100%; height: 200px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        button { margin: 10px 0; padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>PHP 类生成器</h2>
    <p>在下面输入类属性（如 <code>public int $uid;</code>）：</p>
    <textarea id="properties"></textarea><br>
    <label>类名: <input type="text" id="className" value="Demo"></label>
    <button onclick="generate()">生成 PHP 类</button>

    <h3>生成结果：</h3>
    <pre id="output"></pre>

<script>
function ucfirst(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}

function generate() {
    let props = document.getElementById("properties").value.trim().split("\n");
    let className = document.getElementById("className").value.trim() || "Demo";

    let output = `<?php

declare(strict_types=1);
/**
 * This file is part of Hyperf.
 *
 * @link     http://gitlab/bux/bux-server
 * @document http://docs/web/#/6
 * @contact  group@hyperf.io
 * @license  https://github.com/hyperf/hyperf/blob/master/LICENSE
 */
namespace App\\Entity;

class ${className}
{
`;

    props.forEach(line => {
        line = line.trim();
        if (!line) return;
        output += "    " + line + "\n";
    });

    output += "\n";

    props.forEach(line => {
        line = line.trim();
        if (!line.startsWith("public")) return;

        // 匹配 public int $uid;
        let match = line.match(/public\s+(\S+)?\s*\$(\w+);/);
        if (!match) return;

        let type = match[1] && match[1] !== '' ? match[1] : '';
        let name = match[2];
        let methodName = ucfirst(name);

        // set 方法
        output += `    public function set${methodName}(${type ? type + " " : ""}$${name}): void\n    {\n        $this->${name} = $${name};\n    }\n\n`;

        // get 方法
        output += `    public function get${methodName}(): ${type || "mixed"}\n    {\n        return $this->${name};\n    }\n\n`;
    });

    output += "}\n";
    document.getElementById("output").textContent = output;
}
</script>
</body>
</html>
